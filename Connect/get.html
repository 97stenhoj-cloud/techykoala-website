<script>
  var APP_STORE_URL   = "https://apps.apple.com/app/id6756851790";
  var GOOGLE_PLAY_URL = "https://play.google.com/store/apps/details?id=com.stenhoej.connect";
  (function () {
    var ua = navigator.userAgent || navigator.vendor || window.opera;
    if (/android/i.test(ua)) { window.location.replace(GOOGLE_PLAY_URL); return; }
    var isiOS = /iPad|iPhone|iPod/.test(ua) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (isiOS) { window.location.replace(APP_STORE_URL); return; }
  })();
</script>

<style>
  :root{
    --purple:#b06fd6; --pink:#e0559f; --ink:#5a4a66;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Fredoka",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(165deg,#f7f0fd 0%,#efe1f8 55%,#ecdcf6 100%);
    color:var(--ink);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;min-height:100vh;
  }
  .tile{
    width:118px;height:118px;background:#fff;border-radius:28px;
    box-shadow:0 14px 34px rgba(150,90,180,.20);
    display:flex;align-items:center;justify-content:center;margin-bottom:26px;
  }
  .tile img{width:66px;height:auto;display:block;}
  h1{
    font-weight:700;font-size:42px;letter-spacing:.5px;line-height:1;
    background:linear-gradient(90deg,var(--purple),var(--pink));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    margin-bottom:10px;
  }
  .tag{font-weight:500;font-size:16px;color:#a892bd;margin-bottom:36px;}
  .btns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:290px;}
  a.btn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    text-decoration:none;padding:15px 20px;border-radius:16px;
    font-family:"Fredoka",sans-serif;font-size:16px;font-weight:600;
    box-shadow:0 8px 20px rgba(150,90,180,.16);transition:transform .12s ease;
  }
  a.ios{background:#3a2b45;color:#fff;}
  a.android{background:linear-gradient(90deg,var(--purple),var(--pink));color:#fff;}
  a.btn:active{transform:scale(.97);}
  a.btn svg{width:18px;height:18px;fill:currentColor;}
  .hint{margin-top:26px;font-size:13px;color:#b3a2c4;}
</style>
</head>
